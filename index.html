<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Space — Abdelhak Fiqhi</title>
<meta name="theme-color" content="#0d2a27">
<meta name="description" content="أوقات الصلاة، الأذان، الأذكار، والقرآن الكريم برواية ورش.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#0d2a27;--card:#14403a;--line:#2c6b61;--text:#f1ead6;--mute:#a9c3b8;--gold:#e3b04b;--red:#c0483f;--green:#2f9e6b;--qfs:1.6;--fs:32px;--ui:#0d2a27;--uif:#f1ead8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;line-height:1.7;padding:0 14px 40px}
.ar{font-family:Amiri,serif;direction:rtl}
main{max-width:1000px;margin:auto}
header{text-align:center;padding:26px 0 8px;border-bottom:3px double var(--line)}
.verse{font-family:Amiri,serif;font-size:clamp(1.5rem,5vw,2.3rem);color:var(--gold);margin:0}
.welcome{margin:8px 0 10px;color:var(--mute);font-size:1.05rem}
.hbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
h2{font-size:1.15rem;margin:0 0 12px;color:var(--gold)}
section,.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:18px}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.top>*{margin-top:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-bottom:1px dashed var(--line);border-radius:8px}
.row:last-child{border:0}.row b{font-weight:600}.row .t{font-variant-numeric:tabular-nums;color:var(--gold)}
.row.next{background:rgba(227,176,75,.16);border-bottom-color:transparent}
input,select{background:#0b201e;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--gold);color:#2a1c00;font-weight:600}
button.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,.dh:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
.city{display:flex;gap:8px;margin-bottom:8px}.city select{flex:1}
#nextBox{margin:8px 0 4px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0f332e;text-align:center}
#nextBox b{color:var(--gold);font-size:1.15rem}
#cd{font:700 1.7rem Cairo;font-variant-numeric:tabular-nums;letter-spacing:.04em;direction:ltr}
#src{color:var(--mute);font-size:.8rem;margin:6px 0 0}
details{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#0f332e}
summary{cursor:pointer;font-weight:600}
.opt{display:flex;align-items:center;gap:8px;margin:8px 0}.opt input{width:20px;height:20px;accent-color:var(--gold)}
.adj{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.adj label{font-size:.85rem;color:var(--mute);display:flex;flex-direction:column;gap:2px}.adj input{width:100%}
#hadith{font-size:1.45rem;min-height:140px;display:flex;flex-direction:column;justify-content:center;transition:opacity .6s;text-align:center}
#hadith small{font-family:Cairo;color:var(--mute);font-size:.85rem;margin-top:8px}
.tasbih{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tasbih button{background:transparent;color:var(--text);border:2px solid var(--line);font-size:1.25rem;min-height:84px;font-family:Amiri,serif;font-weight:700;position:relative}
.tasbih button:hover{border-color:var(--gold)}
.tasbih button i{position:absolute;top:4px;inset-inline-start:10px;font:600 .8rem Cairo;color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tabs button{background:transparent;color:var(--text);border:2px solid var(--line);font-family:Amiri,serif;font-size:1.25rem}
.tabs button[aria-pressed=true]{background:var(--gold);color:#2a1c00;border-color:var(--gold)}
.dh{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer;font-size:1.3rem;background:#0f332e;position:relative}
.dh span{display:block;font:600 .85rem Cairo;color:var(--gold);margin-top:6px;direction:ltr;text-align:start}
.dh.done{opacity:.45}.dh.done span::after{content:" ✓"}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar input,.bar select{flex:1;min-width:120px}
#msg,#qmsg{color:var(--mute);font-size:.9rem;margin:6px 0}
audio{width:100%;margin:8px 0}
a.btn{display:inline-block;background:var(--gold);color:#2a1c00;padding:9px 14px;border-radius:12px;text-decoration:none;font-weight:600}
.qnote{color:var(--mute);font-size:.85rem;margin-top:8px}
#toast{position:fixed;inset-inline:12px;top:12px;z-index:50;background:var(--gold);color:#2a1c00;border-radius:14px;padding:12px 14px;font-weight:700;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.on{display:flex}

footer{margin-top:28px;border-top:3px double var(--line);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--mute);font-size:.9rem}
.lang button{background:transparent;color:var(--text);border:1px solid var(--line);padding:4px 12px}.lang button[aria-pressed=true]{background:var(--gold);color:#2a1c00}
/* tasbih page */
#ov{position:fixed;inset:0;background:rgba(5,20,18,.94);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#ov.on{display:flex}
.pg{background:var(--card);border:3px solid var(--gold);border-radius:24px;padding:22px;width:min(380px,100%);text-align:center;position:relative}
#num{font:700 3.6rem Cairo;letter-spacing:.06em;border:2px solid var(--line);border-radius:14px;background:#0b201e;padding:6px 0;font-variant-numeric:tabular-nums}
#num.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.08);color:var(--gold)}}
#tn{font-size:1.7rem;margin:14px 0}
.circ{display:flex;justify-content:space-around;margin-top:14px}
.circ button{width:104px;height:104px;border-radius:50%;font-size:1.1rem;color:#fff;border:4px solid rgba(255,255,255,.25)}
#er{background:var(--red)}#ck{background:var(--green);position:relative;overflow:visible}
#x{position:absolute;top:8px;inset-inline-end:8px;background:transparent;color:var(--text);font-size:1.4rem;padding:2px 10px}
.plus{position:fixed;pointer-events:none;font:700 1.8rem Cairo;color:var(--gold);animation:up .8s forwards;z-index:10}
@keyframes up{to{transform:translateY(-90px);opacity:0}}

/* ===== Full-page Quran Modal (from index_2.html) ===== */
#quranModal{display:none;position:fixed;inset:0;z-index:35;flex-direction:column;height:100dvh;overflow:hidden;
  --qbg:#f7f0dc;--qfg:#2b2418;background:var(--qbg);color:var(--qfg);
  font-family:'Amiri Quran','Amiri','Traditional Arabic',serif;direction:rtl}
#quranModal.open{display:flex}
#quranModal.clean .qHeader,#quranModal.clean #tools,#quranModal.clean #juzBar,#quranModal.clean #surahBar{display:none!important}
#qToggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:41;width:38px;height:38px;border-radius:50%;
  border:2px solid var(--gold);background:var(--ui);color:var(--uif);display:grid;place-items:center;font-size:18px;padding:0;
  opacity:.85;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#qToggle:active{transform:scale(.94)}
#quranModal:not(.clean) #qToggle{top:calc(env(safe-area-inset-top,0px) + 52px);right:66px;width:34px;height:34px;font-size:16px}
#quranModal .qHeader,#tools,#juzBar,#surahBar,#sheet,#qToast{font-family:system-ui,'Segoe UI',Tahoma,sans-serif}
#quranModal button{font:inherit;color:inherit;cursor:pointer}
#quranModal .qHeader{display:flex;align-items:center;gap:8px;background:var(--ui);color:var(--uif);
  padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px}
#qClose{background:transparent;border:0;color:inherit;font-size:22px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;padding:0}
#title{flex:1;margin:0;text-align:center;font-family:'Amiri Quran','Amiri',serif;font-size:26px;font-weight:normal;color:var(--uif)}
#juzBtn{background:transparent;border:1px solid var(--gold);color:var(--uif);border-radius:14px;padding:4px 10px;font-size:13px}

#mid{flex:1;display:flex;direction:ltr;min-height:0}
#stage{flex:1;min-width:0;direction:rtl;position:relative}
#reader{position:relative;height:100%;overflow-y:auto;padding:16px 16px 90px;
  font-size:var(--fs);line-height:2.15;text-align:justify;-webkit-overflow-scrolling:touch}
#reader.h{overflow-y:hidden;overflow-x:auto;padding:14px 16px;column-gap:32px;column-fill:auto;scrollbar-width:none}
#reader.h::-webkit-scrollbar{display:none}
.bsm{text-align:center;font-size:1.1em;margin:4px 0 10px}
.ay.mk{border-bottom:2px solid var(--gold)}
.ay.hl{background:rgba(201,162,75,.35);border-radius:6px}
.num{font-size:.62em;color:var(--gold);white-space:nowrap}
.nxt{text-align:center;margin:22px 0;break-inside:avoid}
.nxt button{background:var(--ui);color:var(--uif);border:0;border-radius:20px;padding:10px 20px;font-size:16px;font-family:inherit}
#msgQ{padding:40px 20px;text-align:center;font-family:system-ui,sans-serif;font-size:16px}

#tools{width:58px;background:var(--ui);color:var(--uif);display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:8px 0;overflow-y:auto}
#tools button{width:44px;min-height:44px;border-radius:50%;border:2px solid var(--gold);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
#tools button i{font-style:normal;font-size:19px}
#tools button small{font-size:8px;margin-top:2px;opacity:.85}
#tools button.on{background:var(--gold);color:#1a1a1a}

#juzBar{display:none;align-items:center;gap:6px;background:#12403a;color:var(--uif);padding:8px 10px;overflow-x:auto}
#juzBar.open{display:flex}
#juzBar .lbl{font-size:15px;white-space:nowrap;margin-inline-end:6px}
#juzBar .x{border:0;background:transparent;font-size:20px;padding:0 8px}
.hq{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);padding:0;
  background:conic-gradient(var(--gold) calc(var(--f)*1turn),transparent 0)}
.sep{flex:none;width:2px;height:26px;background:var(--gold);opacity:.6;margin:0 4px}

#surahBar{display:flex;gap:6px;overflow-x:auto;background:var(--ui);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);
  direction:rtl;touch-action:pan-x;scrollbar-width:none}
#surahBar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--gold);background:transparent;color:var(--uif)!important;border-radius:18px;padding:6px 12px;font-size:14px;white-space:nowrap;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip b{color:var(--gold);margin-inline-end:4px}
.chip.on{background:var(--gold);color:#1a1a1a!important}.chip.on b{color:#1a1a1a!important}

#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:42}
#shade.open{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:72dvh;overflow-y:auto;z-index:43;background:var(--ui);color:var(--uif);
  border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .25s}
#sheet.open{transform:none}
#sheet h3{margin:0 0 12px;font-size:17px}
#sheet input[type=search],#sheet input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--gold);background:#0a1f1c;color:var(--uif);font-size:16px}
.shRow{display:block;width:100%;text-align:right;background:#12403a;border:0;border-radius:10px;padding:10px 12px;margin-top:8px;color:var(--uif)}
.shRow small{display:block;color:var(--gold);margin-bottom:3px}
.shRow span{font-family:'Amiri Quran','Amiri',serif;font-size:19px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.grid button,.pill{border:1px solid var(--gold);background:transparent;color:var(--uif);border-radius:10px;padding:9px 0}
.pill{padding:9px 16px;margin-inline-end:8px}
.pill.on{background:var(--gold);color:#1a1a1a}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #fff3;margin:4px}
.sw.on{border-color:var(--gold)}
.line{display:flex;align-items:center;gap:12px;margin:14px 0;flex-wrap:wrap}
.line label{min-width:90px}
.del{border:0;background:transparent;color:#ff9b9b;font-size:18px}
#qToast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:#000c;color:#fff;
  padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:45;max-width:85vw;text-align:center}
#qToast.show{opacity:1}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="toast" role="alert"><span id="toastTxt"></span><button id="toastX" class="ghost" style="color:#2a1c00;border-color:#2a1c00">✕</button></div>

<main>
<header>
  <p class="verse ar">«وَذَكِّرْ فَإِنَّ الذِّكْرَىٰ تَنفَعُ الْمُؤْمِنِينَ»</p>
  <p class="welcome" data-i="welcome"></p>
  <div class="hbtn">
    <button id="inst" hidden data-i="install"></button>
    <button id="enable" data-i="enable"></button>
    <button id="openQuran" data-i="openQuran"></button>
  </div>
  <p id="iosHint" class="welcome" hidden data-i="iosHint"></p>
</header>

<div class="top">
  <section aria-labelledby="hp">
    <h2 id="hp" data-i="prayer"></h2>
    <div class="city">
      <select id="city" aria-label="City"></select>
      <button id="loc" class="ghost" aria-label="Locate me">📍</button>
    </div>
    <div id="nextBox"><span data-i="next"></span> <b id="nextName"></b><div id="cd">--:--:--</div></div>
    <div id="times"></div>
    <p id="src"></p>
    <details>
      <summary data-i="alerts"></summary>
      <label class="opt"><input type="checkbox" id="oN"><span data-i="optN"></span></label>
      <label class="opt"><input type="checkbox" id="oA"><span data-i="optA"></span></label>
      <label class="opt"><input type="checkbox" id="oK"><span data-i="optK"></span></label>
      <p class="qnote" data-i="alertNote"></p>
    </details>
    <details>
      <summary data-i="adjust"></summary>
      <div class="adj" id="adj"></div>
      <p class="qnote" data-i="adjustNote"></p>
    </details>

  <section aria-labelledby="hh">

</div>

<section aria-labelledby="ht">
  <h2 id="ht" data-i="tasbih"></h2>
  <div class="tasbih" id="tasbih"></div>
</section>

<section aria-labelledby="ha">
  <h2 id="ha" data-i="adhkar"></h2>
  <div class="tabs" id="tabs"></div>

</section>

<section aria-labelledby="hd">
  <h2 id="hd" data-i="adhan"></h2>

</section>

<footer>
  <div>Terms Reserved © 2026<br>Created by ABDELHAK FIQHI</div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button>
  </div>
</footer>
</main>

<!-- Full-Page Quran Modal -->
<div id="quranModal" class="clean" role="dialog" aria-modal="true" aria-label="القرآن الكريم">
  <button id="qToggle" aria-label="إظهار أو إخفاء الأدوات" title="إظهار / إخفاء القوائم">☰</button>
  <div class="qHeader">
    <button id="qClose" aria-label="رجوع">→</button>
    <h1 id="title">القرآن الكريم</h1>
    <button id="juzBtn" aria-label="الأجزاء">الجزء ١</button>

  <div id="mid">
    <div id="stage"><div id="reader"><div id="msgQ">جاري تحميل المصحف…</div></div></div>

    <nav id="tools" aria-label="الأدوات">
      <button id="bSearch" aria-label="بحث"><i>🔍</i><small>بحث</small></button>
      <button id="bMarks" aria-label="محفوظة"><i>🔖</i><small>محفوظة</small></button>
      <button id="bPages" aria-label="الصفحات"><i>📄</i><small>الصفحات</small></button>
      <button id="bAjza" aria-label="الأجزاء"><i>📚</i><small>الأجزاء</small></button>
      <button id="bBg" aria-label="الخلفية"><i>🎨</i><small>الخلفية</small></button>
      <button id="bNight" aria-label="الوضع الليلي"><i>🌙</i><small>ليلي</small></button>
      <button id="bAuto" aria-label="تمرير تلقائي"><i>⏬</i><small>تلقائي</small></button>
      <button id="bShare" aria-label="مشاركة"><i>↗️</i><small>مشاركة</small></button>
      <button id="bSet" aria-label="الإعدادات"><i>⚙️</i><small>إعدادات</small></button>
    </nav>
  </div>

  <div id="juzBar"></div>
  <div id="surahBar"></div>
</div>

<div id="shade"></div>
<div id="sheet"></div>
<div id="qToast"></div>

<div id="ov" role="dialog" aria-modal="true">
  <div class="pg">
    <button id="x" aria-label="Close">✕</button>
    <div id="num">0</div>
    <div id="tn" class="ar"></div>
    <div class="circ"><button id="er" data-i="erase"></button><button id="ck" data-i="click"></button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');

/* ---------- Languages ---------- */
const T={
ar:{welcome:"مرحباً بك في فضائك، حيث تزداد قرباً من الله",prayer:"أوقات الصلاة",hadith:"من أعظم الأحاديث (يتغير كل 5 دقائق)",tasbih:"عدّاد التسبيحات",adhkar:"الأذكار",openQuran:"📖 القرآن الكريم",adhan:"صوت الأذان",download:"تحميل الأذان",adhanNote:"ملف الأذان adhan.mp3 غير موجود بجانب الموقع. ضعه في نفس المجلد على GitHub.",erase:"مسح",click:"اضغط",times:["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"],tabs:["أذكار الصباح","أذكار المساء","أذكار الاستيقاظ","أذكار النوم"],
install:"📲 تثبيت التطبيق",iosHint:"على الآيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».",enable:"🔔 تفعيل التنبيهات والأذان",enabled:"🔔 التنبيهات مفعّلة",denied:"التنبيهات محجوبة. فعّلها من إعدادات المتصفح للموقع.",

/* ---------- Prayer times (shown in your device clock) ---------- */
const lp=ms=>{const d=new Date(ms);return{year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()}};
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};

/* Astronomical calculation — Fajr 19°, Isha 17° (Moroccan method), Asr shadow ×1 */
const RAD=Math.PI/180,DEG=180/Math.PI;
const sn=a=>Math.sin(a*RAD),cs=a=>Math.cos(a*RAD),tn=a=>Math.tan(a*RAD);
const asn=x=>Math.asin(x)*DEG,acs=x=>Math.acos(Math.max(-1,Math.min(1,x)))*DEG,at2=(y,x)=>Math.atan2(y,x)*DEG;
const fx=(a,b)=>a-b*Math.floor(a/b);
function sunPos(jd){
  const d=jd-2451545,g=fx(357.529+.98560028*d,360),q=fx(280.459+.98564736*d,360),L=fx(q+1.915*sn(g)+.020*sn(2*g),360),e=23.439-3.6e-7*d;
  const RA=fx(at2(cs(e)*sn(L),cs(L))/15,24);
  let eq=q/15-RA;eq=((eq+12)%24+24)%24-12;
  return{dec:asn(sn(e)*sn(L)),eq};
}
const BASE_ADJ=[0,0,5,0,5,0];   // Fajr, Sunrise, Dhuhr(+5), Asr, Maghrib(+5), Isha
function calc(y,m,d,lat,lon){
  const jd=Date.UTC(y,m-1,d,12)/864e5+2440587.5,{dec,eq}=sunPos(jd);
  const noon=12-eq-lon/15;  // solar noon, hours UT
  const ang=a=>acs((-sn(a)-sn(dec)*sn(lat))/(cs(dec)*cs(lat)))/15;  // hours from noon when the sun is a° below the horizon
  const asrAlt=Math.atan(1/(1+tn(Math.abs(lat-dec))))*DEG;   // sun altitude at Asr (shadow = object + its noon shadow)
  const asrT=acs((sn(asrAlt)-sn(lat)*sn(dec))/(cs(lat)*cs(dec)))/15;
  const h=[noon-ang(19),noon-ang(.833),noon,noon+asrT,noon+ang(.833),noon+ang(17)];
  const day0=Date.UTC(y,m-1,d);
  return h.map((x,i)=>Math.round((day0+x*3600e3)/6e4)*6e4+BASE_ADJ[i]*6e4);
}
const opts=Object.assign({n:true,a:true,k:true,adj:[0,0,0,0,0,0]},store.get('opts',{}));
let todayT=null,tomT=null,src='calc';
const addAdj=arr=>arr.map((t,i)=>t+(opts.adj[i]||0)*6e4);

const DEVTZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Africa/Casablanca'}catch(e){return'Africa/Casablanca'}})();
async function online(c,p){
  const key=`pt|${c[0]}|${DEVTZ}|${p.year}-${p.month}-${p.day}`,hit=store.get(key,null);
  if(hit)return hit;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch(`https://api.aladhan.com/v1/timings/${pad(p.day)}-${pad(p.month)}-${p.year}?latitude=${c[2]}&longitude=${c[3]}&method=21&timezonestring=${encodeURIComponent(DEVTZ)}`,{signal:ctl.signal});
    const j=await r.json();if(j.code!==200)throw 0;const t=j.data.timings;
    const arr=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map(k=>{const [h,mi]=String(t[k]).slice(0,5).split(':').map(Number);return new Date(p.year,p.month-1,p.day,h,mi).getTime()});
    if(arr.some(x=>!isFinite(x)))throw 0;
    Object.keys(localStorage).filter(k=>k.startsWith('pt|')&&k!==key).forEach(k=>store.del(k));
    store.set(key,arr);return arr;
  }finally{clearTimeout(to)}
}
async function loadTimes(){
  const c=cityObj(),p=lp(Date.now());
  todayT=calc(p.year,p.month,p.day,c[2],c[3]);tomT=calc(p.year,p.month,p.day+1,c[2],c[3]);src='calc';
  drawTimes();
  try{todayT=await online(c,p);src='online'}catch(e){}
  drawTimes();tick();
}
const ICONS=['🌙','🌅','☀️','🌤️','🌇','🌌'];
function allPrayers(){ // [{i,ms}] for today and tomorrow (prayers only, no sunrise)
  if(!todayT)return[];
  const a=addAdj(todayT),b=addAdj(tomT),out=[];
  [0,2,3,4,5].forEach(i=>out.push({i,ms:a[i],day:0}));
  [0,2,3,4,5].forEach(i=>out.push({i,ms:b[i],day:1}));
  return out;
}
function nextPrayer(){const n=Date.now();return allPrayers().find(e=>e.ms>n)}
function drawTimes(){
  const a=todayT?addAdj(todayT):null,nx=nextPrayer();
  $('#times').innerHTML=T[lang].times.map((n,i)=>`<div class="row${nx&&nx.day===0&&nx.i===i?' next':''}"><b>${ICONS[i]} ${n}</b><span class="t">${a?hm(a[i]):'--:--'}</span></div>`).join('');
  $('#src').textContent=src==='online'?T[lang].srcOnline:T[lang].srcCalc;
}
function drawAdj(){
  $('#adj').innerHTML=T[lang].times.map((n,i)=>`<label>${n}<input type="number" min="-30" max="30" step="1" value="${opts.adj[i]||0}" data-a="${i}"></label>`).join('');
  document.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>{opts.adj[+e.dataset.a]=Math.max(-30,Math.min(30,Math.round(+e.value||0)));store.set('opts',opts);drawTimes();tick()});

function tick(){
  const nx=nextPrayer();
  if(nx){
    const s=Math.max(0,Math.floor((nx.ms-Date.now())/1000));
    $('#nextName').textContent=T[lang].times[nx.i];
    $('#cd').textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
    if(s===0||nx.ms!==lastNext){lastNext=nx.ms;drawTimes()}
  }
  checkAlerts();
}

function notify(title,tag){

  const o={body:'Your Space',icon:'icon-192.png',badge:'icon-192.png',tag,vibrate:[200,100,200]};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});
  else try{new Notification(title,o)}catch(e){}
}
function playAdhan(){adhan.pause();adhan.currentTime=0;const p=adhan.play();if(p&&p.catch)p.catch(()=>{})}
function events(){
  if(!todayT)return[];
  const out=[],a=addAdj(todayT),p=lp(Date.now()),dk=`${p.year}-${p.month}-${p.day}`;
  [0,2,3,4,5].forEach(i=>out.push({k:`${dk}|p${i}`,ms:a[i],type:'p',i}));
  out.push({k:`${dk}|km`,ms:a[0]+20*6e4,type:'km'});   // morning adhkar: 20 min after Fajr
  out.push({k:`${dk}|ke`,ms:a[3]+15*6e4,type:'ke'});   // evening adhkar: 15 min after Asr
  return out;
}
function checkAlerts(){
  const now=Date.now(),fired=store.get('fired',{}),p=lp(now),dk=`${p.year}-${p.month}-${p.day}`;
  let ch=false;
  Object.keys(fired).forEach(k=>{if(!k.startsWith(dk)){delete fired[k];ch=true}});
  events().forEach(ev=>{
    const late=now-ev.ms;
    if(late<0||late>10*6e4||fired[ev.k])return;
    if(ev.type==='p'){
      if(!opts.n&&!opts.a)return;
      fired[ev.k]=1;ch=true;
      if(opts.n)notify(T[lang].nPray(T[lang].times[ev.i]),ev.k);
      if(opts.a&&late<2*6e4)playAdhan();
    }else{
      if(!opts.k)return;
      fired[ev.k]=1;ch=true;
      notify(ev.type==='km'?T[lang].nMorning:T[lang].nEvening,ev.k);
    }
  });
  if(ch)store.set('fired',fired);
}

/* ============ Full-Page Quran Reader (from index_2.html) ============ */
const LOCAL_SRC = 'quran.json';
const API_SRC   = 'https://api.alquran.cloud/v1/quran/quran-uthmani';
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm = t => t.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
                   .replace(/[\u0622\u0623\u0625\u0671]/g,'\u0627').replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647');
const debounce = (f,ms) => { let t; return (...a) => { clearTimeout(t); t=setTimeout(()=>f(...a),ms) } };

const BG = [
  {id:'paper', bg:'#f7f0dc', fg:'#2b2418'},
  {id:'white', bg:'#ffffff', fg:'#111111'},
  {id:'green', bg:'#e3f1e6', fg:'#10301c'},
  {id:'sky',   bg:'#e3effa', fg:'#12263d'},
  {id:'rose',  bg:'#fbe9e7', fg:'#3b1f1b'},
  {id:'teal',  bg:'#0d2a27', fg:'#f1ead8'}
];
let qrSet = Object.assign({fs:32, mode:'v', bg:'paper', night:false, speed:3}, store.get('qr_set',{}));
const saveQrSet = () => store.set('qr_set', qrSet);

let Q = [], qCur = 0, NI = null, qLoaded = false;
const QM = $('#quranModal');
const R = $('#reader');

function parse(j){
  const surahs = (j.data && j.data.surahs) || j.surahs || j;
  return surahs.map(s => ({
    n:s.number, name:s.name, en:s.englishName||'', type:s.revelationType||'',
    ay:s.ayahs.map(a => ({n:a.numberInSurah, t:a.text, juz:a.juz, page:a.page, hq:a.hizbQuarter, sj:!!a.sajda}))
  }));
}
async function loadData(){
  try{ const r = await fetch(LOCAL_SRC); if(r.ok){ return parse(await r.json()); } }catch(e){}
  const cached = store.get('qr_cache_v2', null);
  if(cached) return cached;
  const r = await fetch(API_SRC);
  const data = parse(await r.json());
  store.set('qr_cache_v2', data);
  return data;
}

function stripBsm(t){
  const p = t.split(' ');
  return norm(p.slice(0,4).join(' ')).startsWith('بسم الله الرحمن الرحيم') ? p.slice(4).join(' ') : t;
}
const ayText = (si,a) => { const s=Q[si], x=s.ay[a-1]; return (a===1 && s.n!==1 && s.n!==9) ? stripBsm(x.t) : x.t; };

function applyTheme(){
  const t = BG.find(b => b.id===qrSet.bg) || BG[0];
  QM.style.setProperty('--qbg', qrSet.night ? '#000' : t.bg);
  QM.style.setProperty('--qfg', qrSet.night ? '#fff' : t.fg);
  QM.style.setProperty('--fs', qrSet.fs+'px');
  $('#bNight').classList.toggle('on', qrSet.night);
}
function layout(){
  applyTheme();
  R.className = qrSet.mode==='h' ? 'h' : '';
  R.style.columnWidth = qrSet.mode==='h' ? Math.max(120, R.clientWidth-32)+'px' : '';
}

function openSurah(si, an=1){
  qCur = si;
  const s = Q[si], marks = store.get('qr_marks',[]);
  let h = '';
  if(s.n!==1 && s.n!==9) h += '<div class="bsm">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>';
  h += s.ay.map(a => {
    const mk = marks.some(m => m.s===si && m.a===a.n) ? ' mk' : '';
    return `<span class="ay${mk}" id="a${si}-${a.n}" data-a="${a.n}">${esc(ayText(si,a.n))} <span class="num">﴿${AR(a.n)}﴾</span></span> `;
  }).join('');
  if(si < Q.length-1) h += `<div class="nxt"><button id="nextS">${esc(Q[si+1].name)} ←</button></div>`;
  R.innerHTML = h;
  layout();
  $('#title').textContent = s.name;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.i===si));
  const on = document.querySelector('.chip.on'); if(on) on.scrollIntoView({inline:'center', block:'nearest'});
  if(an>1) goAyah(si,an); else { R.scrollTop=0; R.scrollLeft=0; }
  onScroll();
}

function goAyah(si, an){
  if(si!==qCur){ openSurah(si,an); return; }
  const el = $(`#a${si}-${an}`); if(!el) return;
  if(qrSet.mode==='v'){ R.scrollTop = Math.max(0, el.offsetTop - 12); }
  else{
    const c = R.getBoundingClientRect(), r = el.getClientRects()[0], W = R.clientWidth;
    const cx = r.left + r.width/2;
    R.scrollBy({left: (Math.floor((cx - c.right)/W) + 1) * W});
  }
  el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'), 1800);
}

function curAyah(){
  const c = R.getBoundingClientRect();
  for(const e of R.querySelectorAll('.ay')){
    const r = e.getClientRects()[0]; if(!r) continue;
    if(qrSet.mode==='v'){ if(r.bottom > c.top+10) return +e.dataset.a; }
    else if(r.right <= c.right+2 && r.right > c.left+2 && r.top < c.bottom) return +e.dataset.a;
  }
  return 1;
}

function onScroll(){
  if(!Q.length) return;
  const a = curAyah(), x = Q[qCur].ay[a-1] || Q[qCur].ay[0];
  $('#juzBtn').textContent = 'الجزء ' + AR(x.juz || 1);
  store.set('qr_last', {s:qCur, a});
  const pos = store.get('qr_pos',{}); pos[qCur]=a; store.set('qr_pos', pos);
  if($('#juzBar').classList.contains('open')) buildJuz();
}
R.addEventListener('scroll', debounce(() => {
  if(qrSet.mode==='h'){
    const W = R.clientWidth, i = Math.round(Math.abs(R.scrollLeft)/W), sign = R.scrollLeft>0 ? 1 : -1;
    if(Math.abs(Math.abs(R.scrollLeft) - i*W) > 3) R.scrollTo({left: sign*i*W, behavior:'smooth'});
  }
  onScroll();
}, 160));
R.addEventListener('click', e => { if(e.target.id==='nextS') openSurah(qCur+1); });

function buildChips(){
  const bar = $('#surahBar'); bar.innerHTML='';
  Q.forEach((s,i) => {
    const b = document.createElement('button');
    b.className='chip'; b.dataset.i=i;
    b.innerHTML = `<b>${AR(s.n)}</b>${esc(s.name.replace('سورة ',''))}`;
    let t=null, held=false;
    b.addEventListener('pointerdown', () => {
      held=false;
      t=setTimeout(() => { held=true; if(navigator.vibrate) navigator.vibrate(30); openSurah(i,1); qToast(`${s.name} — من البداية`); }, 500);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, () => clearTimeout(t)));
    b.addEventListener('click', () => { if(held){ held=false; return; } openSurah(i, (store.get('qr_pos',{})[i]) || 1); });
    b.addEventListener('contextmenu', e => e.preventDefault());
    bar.appendChild(b);
  });
}

function buildJuz(){
  const a = curAyah(), x = Q[qCur].ay[a-1] || Q[qCur].ay[0], j = x.juz || 1;
  const bar = $('#juzBar');
  let h = `<span class="lbl">الجزء ${AR(j)}</span>`;
  if(x.hq){
    for(let k=1;k<=8;k++){
      if(k===5) h += '<span class="sep"></span>';
      h += `<button class="hq" style="--f:${[.25,.5,.75,1][(k-1)%4]}" data-hq="${(j-1)*8+k}" aria-label="ربع الحزب ${AR(k)}"></button>`;
    }
  }
  h += '<button class="x" id="juzX" aria-label="إغلاق">✕</button>';
  bar.innerHTML = h;
}
function jumpTo(test){
  for(let i=0;i<Q.length;i++) for(const a of Q[i].ay) if(test(a)){ goAyah(i,a.n); return true; }
  return false;
}
$('#juzBar').addEventListener('click', e => {
  if(e.target.id==='juzX'){ $('#juzBar').classList.remove('open'); return; }
  const hq = e.target.dataset && e.target.dataset.hq; if(hq) jumpTo(a => a.hq===+hq);
});
$('#juzBtn').onclick = () => { buildJuz(); $('#juzBar').classList.toggle('open'); };

function openSheet(html, bind){
  $('#sheet').innerHTML = html; $('#shade').classList.add('open'); $('#sheet').classList.add('open');
  if(bind) bind($('#sheet'));
}
function closeSheet(){ $('#shade').classList.remove('open'); $('#sheet').classList.remove('open'); }
$('#shade').onclick = closeSheet;

function panelSearch(){
  openSheet(`<h3>🔍 البحث في القرآن</h3><input id="q" type="search" placeholder="اكتب كلمة أو جزءًا من آية…" autocomplete="off"><div id="res"></div>`, sh => {
    const q = sh.querySelector('#q'), res = sh.querySelector('#res');
    q.focus();
    q.addEventListener('input', debounce(() => {
      const w = norm(q.value.trim()); if(w.length<2){ res.innerHTML=''; return; }
      if(!NI) NI = Q.map(s => s.ay.map(a => norm(a.t)));
      const out = []; 
      outer: for(let i=0;i<Q.length;i++) for(let k=0;k<NI[i].length;k++) if(NI[i][k].includes(w)){ out.push([i,k+1]); if(out.length>=80) break outer; }
      res.innerHTML = out.length
        ? `<p style="opacity:.8">${AR(out.length)}${out.length>=80?'+':''} نتيجة</p>` + out.map(([i,a]) =>
            `<button class="shRow" data-s="${i}" data-a="${a}"><small>${esc(Q[i].name)} · الآية ${AR(a)}</small><span>${esc(ayText(i,a).slice(0,140))}</span></button>`).join('')
        : '<p>لا توجد نتائج.</p>';
    }, 250));
    res.addEventListener('click', e => { const b=e.target.closest('.shRow'); if(b){ closeSheet(); goAyah(+b.dataset.s, +b.dataset.a); } });
  });
}

function panelMarks(){
  const draw = sh => {
    const marks = store.get('qr_marks',[]);
    sh.innerHTML = `<h3>🔖 المواضع المحفوظة</h3><button class="pill on" id="addMark">＋ حفظ الموضع الحالي</button>` +
      (marks.length ? marks.map((m,i) =>
        `<div style="display:flex;gap:6px;align-items:center"><button class="shRow" style="flex:1" data-i="${i}"><small>${esc(Q[m.s].name)}</small><span>الآية ${AR(m.a)}</span></button><button class="del" data-d="${i}" aria-label="حذف">🗑</button></div>`).join('')
        : '<p style="opacity:.8">لا يوجد شيء محفوظ بعد.</p>');
  };
  openSheet('', sh => {
    draw(sh);
    sh.addEventListener('click', e => {
      const m = store.get('qr_marks',[]);
      if(e.target.id==='addMark'){
        const a = curAyah(); if(!m.some(x => x.s===qCur && x.a===a)) m.push({s:qCur,a});
        store.set('qr_marks',m); draw(sh); qToast('تم الحفظ ✓');
        const el=$(`#a${qCur}-${a}`); if(el) el.classList.add('mk');
      } else if(e.target.dataset.d !== undefined){
        const [x] = m.splice(+e.target.dataset.d,1); store.set('qr_marks',m); draw(sh);
        const el=$(`#a${x.s}-${x.a}`); if(el) el.classList.remove('mk');
      } else { const b = e.target.closest('.shRow'); if(b){ const x=m[+b.dataset.i]; closeSheet(); goAyah(x.s,x.a); } }
    });
  });
}

function panelPages(){
  const hasPage = !!(Q[0] && Q[0].ay[0].page);
  let h = '<h3>📄 الأجزاء والصفحات</h3><div class="grid">';
  for(let j=1;j<=30;j++) h += `<button data-j="${j}">${AR(j)}</button>`;
  h += '</div>';
  if(hasPage) h += '<div class="line"><label for="pg">رقم الصفحة (١–٦٠٤)</label><input id="pg" type="number" min="1" max="604" style="width:110px"><button class="pill on" id="goPg">انتقال</button></div>';
  openSheet(h, sh => {
    sh.addEventListener('click', e => {
      if(e.target.dataset.j){ closeSheet(); jumpTo(a => a.juz===+e.target.dataset.j); }
      if(e.target.id==='goPg'){ const p=+sh.querySelector('#pg').value; if(p>=1){ closeSheet(); jumpTo(a => a.page===p); } }
    });
  });
}

function panelAjza(){
  const a = curAyah(), curJ = (Q[qCur].ay[a-1] || Q[qCur].ay[0]).juz || 1;
  let h = '<h3>📚 الأجزاء (١ – ٣٠)</h3><div class="grid">';
  for(let j=1;j<=30;j++){
    h += `<button class="${j===curJ?'pill on':''}" style="padding:9px 0;margin:0" data-j="${j}">الجزء ${AR(j)}</button>`;
  }
  h += '</div>';
  openSheet(h, sh => {
    sh.addEventListener('click', e => {
      if(e.target.dataset.j){ closeSheet(); jumpTo(ay => ay.juz===+e.target.dataset.j); }
    });
  });
}

function panelBg(){
  openSheet('<h3>🎨 الخلفية</h3><div style="display:flex;flex-wrap:wrap">' +
    BG.map(b => `<button class="sw${qrSet.bg===b.id?' on':''}" data-b="${b.id}" style="background:${b.bg}" aria-label="${b.id}"></button>`).join('') + '</div>',
    sh => sh.addEventListener('click', e => {
      if(e.target.dataset.b){ qrSet.bg=e.target.dataset.b; qrSet.night=false; saveQrSet(); applyTheme();
        sh.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x.dataset.b===qrSet.bg)); }
    }));
}

function panelSettings(){
  const draw = sh => {
    sh.innerHTML = `<h3>⚙️ الإعدادات</h3>
      <div class="line"><label>حجم الخط</label><button class="pill" id="fm">−</button><b id="fv">${qrSet.fs}</b><button class="pill" id="fp">+</button></div>
      <div class="line"><label>طريقة التصفح</label>
        <button class="pill${qrSet.mode==='v'?' on':''}" data-m="v">عمودي ↕</button>
        <button class="pill${qrSet.mode==='h'?' on':''}" data-m="h">أفقي ↔</button></div>
      <div class="line"><label>سرعة التمرير</label><input id="sp" type="range" min="1" max="8" value="${qrSet.speed}" style="flex:1"></div>`;
  };
  openSheet('', sh => {
    draw(sh);
    sh.addEventListener('click', e => {
      const id = e.target.id;
      if(id==='fm'||id==='fp'){ qrSet.fs = Math.min(64, Math.max(18, qrSet.fs + (id==='fp'?2:-2))); saveQrSet(); const a=curAyah(); layout(); goAyah(qCur,a); $('#fv').textContent=qrSet.fs; }
      if(e.target.dataset.m){ const a=curAyah(); qrSet.mode=e.target.dataset.m; saveQrSet(); setAuto(false); layout(); setTimeout(()=>goAyah(qCur,a),30); draw(sh); }
    });
    sh.addEventListener('input', e => { if(e.target.id==='sp'){ qrSet.speed=+e.target.value; saveQrSet(); } });
  });
}

$('#bNight').onclick = () => { qrSet.night=!qrSet.night; saveQrSet(); applyTheme(); };

let auto=false, raf=0, lastTs=0, acc=0, hTimer=0, touching=false, wl=null;
function setAuto(on){
  auto = on; $('#bAuto').classList.toggle('on', on);
  cancelAnimationFrame(raf); clearInterval(hTimer);
  if(on){
    lastTs=0; acc=0;
    if(qrSet.mode==='v') raf=requestAnimationFrame(step);
    else hTimer=setInterval(() => {
      const W=R.clientWidth, atEnd = Math.abs(R.scrollLeft)+W >= R.scrollWidth-4;
      if(atEnd){ setAuto(false); qToast('نهاية السورة'); } else R.scrollBy({left:-W, behavior:'smooth'});
    }, Math.max(3000, (20 - qrSet.speed*2.2)*1000));
    try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(l => wl=l).catch(()=>{}); }catch(e){}
    qToast('بدأ التمرير التلقائي');
  } else if(wl){ try{ wl.release(); }catch(e){} wl=null; }
}
function step(ts){
  if(!auto) return;
  if(!lastTs) lastTs=ts;
  const dt = Math.min(ts-lastTs, 100); lastTs = ts;
  if(!touching){
    acc += qrSet.speed*12*dt/1000;
    const d = Math.floor(acc);
    if(d>=1){
      acc -= d; R.scrollTop += d;
      if(R.scrollTop + R.clientHeight >= R.scrollHeight-2){ setAuto(false); qToast('نهاية السورة'); return; }
    }
  }
  raf = requestAnimationFrame(step);
}
R.addEventListener('touchstart', () => touching=true, {passive:true});
R.addEventListener('touchend', () => setTimeout(()=>touching=false, 900), {passive:true});
$('#bAuto').onclick = () => setAuto(!auto);

async function share(){
  const a = curAyah();
  const text = `﴿${ayText(qCur,a)}﴾\n[${Q[qCur].name} : ${AR(a)}]`;
  const url = location.href.split('#')[0] + `#${qCur+1}:${a}`;
  try{
    if(navigator.share) await navigator.share({title:'القرآن الكريم', text, url});
    else { await navigator.clipboard.writeText(text+'\n'+url); qToast('تم النسخ ✓'); }
  }catch(e){}
}

$('#bSearch').onclick = panelSearch; $('#bMarks').onclick = panelMarks; $('#bPages').onclick = panelPages; $('#bAjza').onclick = panelAjza;
$('#bBg').onclick = panelBg; $('#bShare').onclick = share; $('#bSet').onclick = panelSettings;

let tt; function qToast(m){ const t=$('#qToast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }

addEventListener('resize', debounce(() => { if(!QM.classList.contains('open')) return; const a=curAyah(); layout(); goAyah(qCur,a); }, 200));
addEventListener('keydown', e => {
  if(!QM.classList.contains('open') || qrSet.mode!=='h' || e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft') R.scrollBy({left:-R.clientWidth, behavior:'smooth'});
  if(e.key==='ArrowRight') R.scrollBy({left:R.clientWidth, behavior:'smooth'});
});

async function openQuranFullPage(){
  QM.classList.add('open');
  document.body.style.overflow = 'hidden';
  applyTheme();
  if(!qLoaded){
    try{ Q = await loadData(); qLoaded = true; }
    catch(e){ R.innerHTML = '<div id="msgQ">تعذّر تحميل المصحف. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.</div>'; return; }
    buildChips();
    const m = location.hash.match(/^#(\d+):(\d+)$/), last = store.get('qr_last', null);
    if(m && Q[+m[1]-1]) openSurah(+m[1]-1, +m[2]);
    else if(last && Q[last.s]) openSurah(last.s, last.a);
    else openSurah(0,1);
  } else {
    const a = curAyah();
    layout();
    goAyah(qCur, a);
  }
}

function closeQuranFullPage(){
  setAuto(false);
  closeSheet();
  QM.classList.remove('open');
  document.body.style.overflow = '';
}

$('#qToggle').onclick = () => {
  QM.classList.toggle('clean');
  if (qrSet.mode === 'h') { const a = curAyah(); layout(); setTimeout(() => goAyah(qCur, a), 30); }
};
$('#openQuran').onclick = () => { QM.classList.add('clean'); openQuranFullPage(); };
$('#qClose').onclick = closeQuranFullPage;

/* ---------- Start ---------- */
drawTasbih();applyLang(lang);loadTimes();
if(/^#(\d+):(\d+)$/.test(location.hash)) openQuranFullPage();
</script>
